<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditoría TMS | JL ConsulTIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .img-zoom { transition: transform 0.3s ease; cursor: zoom-in; }
        .img-zoom:active { transform: scale(1.05); }
        .btn-send { box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.6); }
        
        /* Estilo de la cámara para móviles */
        .camera-btn::before {
            content: '📷 ACTUALIZAR';
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: white;
            border-radius: 12px;
            width: 100%;
            height: 44px;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body x-data="vercelApp()" class="bg-slate-200 font-['Inter']">

    <div x-show="zoomImg" x-cloak class="fixed inset-0 z-[300] bg-black/95 flex items-center justify-center p-4" @click="zoomImg = null">
        <button class="absolute top-6 right-6 text-white text-3xl font-bold">&times;</button>
        <img :src="zoomImg" class="max-w-full max-h-full rounded-lg shadow-2xl">
    </div>

    <header x-show="loggedIn" x-cloak class="sticky top-0 z-50 bg-slate-900 text-white p-4 shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-black tracking-tighter italic uppercase">TMS <span class="text-blue-500">AUDITOR</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" x-text="regionName"></p>
            </div>
            <div class="flex gap-2">
                <button @click="showFilters = !showFilters" class="px-4 py-2 bg-slate-800 rounded-xl text-xs font-bold uppercase">Filtros</button>
                <button @click="logout()" class="px-4 py-2 bg-red-900/40 text-red-300 rounded-xl text-xs font-bold">SALIR</button>
            </div>
        </div>
        <div class="flex p-1 bg-slate-800 rounded-2xl">
            <button @click="switchProject('item15')" class="flex-1 py-2.5 rounded-xl text-xs font-black uppercase transition" :class="activeProject === 'item15' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'">Ancash</button>
            <button @click="switchProject('item3')" class="flex-1 py-2.5 rounded-xl text-xs font-black uppercase transition" :class="activeProject === 'item3' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'">Piura</button>
        </div>
    </header>

    <div x-show="showFilters" x-transition class="bg-white p-6 shadow-2xl border-b space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <template x-for="f in filterHeaders">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block" x-text="f"></label>
                    <select x-model="activeFilters[f]" class="w-full border-2 border-slate-100 rounded-xl p-3 text-xs bg-slate-50 outline-none">
                        <option value="">Todos</option>
                        <template x-for="v in getUniqueValues(f)"><option :value="v" x-text="v"></option></template>
                    </select>
                </div>
            </template>
        </div>
        <input type="text" x-model="searchMod" placeholder="BUSCAR CÓDIGO MODULAR..." class="w-full p-4 border-2 border-slate-100 rounded-2xl text-xs font-bold bg-slate-50 focus:border-blue-500 outline-none">
    </div>

    <main x-show="loggedIn" class="p-4 pb-40 max-w-2xl mx-auto">
        <template x-for="item in filteredData" :key="item.id">
            <div class="bg-white rounded-[2.5rem] mb-10 shadow-lg overflow-hidden border border-slate-200">
                
                <div class="p-6 bg-white border-b flex justify-between items-start">
                    <div>
                        <h3 class="font-black text-slate-900 text-base leading-tight mb-1" x-text="item.IIEE"></h3>
                        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-tighter" x-text="item.COD_MOD + ' • ' + item.Nivel"></p>
                        <div class="flex gap-2 mt-2">
                            <span class="text-[9px] font-black px-2 py-1 bg-slate-100 rounded-md text-slate-600 uppercase" x-text="item.DISTRITO"></span>
                            <span class="text-[9px] font-black px-2 py-1 bg-slate-100 rounded-md text-slate-600 uppercase" x-text="item.UGEL"></span>
                        </div>
                    </div>
                </div>
                
                <div class="p-2 space-y-8">
                    <template x-for="img in item.images">
                        <div class="bg-slate-50 rounded-[2rem] p-4 border border-slate-100">
                            <div class="flex justify-between items-center mb-3 px-2">
                                <span class="text-[11px] font-black text-slate-800 uppercase tracking-widest" x-text="img.label"></span>
                                <span class="text-[10px] font-bold" :class="img.url ? 'text-green-600' : 'text-red-500'" x-text="img.url ? '✓ REGISTRADA' : '⚠ PENDIENTE'"></span>
                            </div>

                            <div class="relative aspect-video bg-slate-200 rounded-3xl overflow-hidden shadow-inner mb-4">
                                <template x-if="img.url">
                                    <img :src="img.url" @click="zoomImg = img.url" class="w-full h-full object-cover img-zoom shadow-md">
                                </template>
                                <template x-if="!img.url">
                                    <div class="w-full h-full flex flex-col items-center justify-center text-slate-400">
                                        <span class="text-4xl mb-2">📷</span>
                                        <p class="text-[10px] font-bold uppercase tracking-widest">Sin imagen cargada</p>
                                    </div>
                                </template>
                            </div>

                            <div class="relative">
                                <input type="file" accept="image/*" class="opacity-0 absolute inset-0 w-full h-full z-10 cursor-pointer camera-btn" 
                                       @change="uploadPhoto($event, item, img.label)">
                                <div class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl text-center text-xs tracking-widest shadow-lg flex items-center justify-center gap-2">
                                    <span>📷</span> ACTUALIZAR ESTA IMAGEN
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <div x-show="loggedIn" class="fixed bottom-8 left-0 right-0 px-8 z-[60]">
        <button @click="submitFinalReport()" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-6 rounded-3xl btn-send flex items-center justify-center gap-4 transition-all active:scale-95">
            <div class="text-left">
                <p class="leading-none text-xl uppercase tracking-tighter">Enviar Reporte Final</p>
                <p class="text-[10px] opacity-90 font-bold uppercase mt-1" x-text="'Validar en CambiosMonitor-' + (activeProject === 'item15' ? 'Ancash' : 'Piura')"></p>
            </div>
        </button>
    </div>

    <div x-show="!loggedIn" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-6 z-[100]">
        <div class="bg-white p-10 rounded-[3rem] w-full max-w-sm">
            <h2 class="text-2xl font-black text-slate-900 uppercase tracking-widest mb-8 text-center italic">JL <span class="text-blue-600">TMS</span></h2>
            <div class="space-y-4">
                <input type="email" x-model="config.email" placeholder="CORREO" class="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-sm border-2 border-transparent focus:border-blue-500 transition">
                <input type="password" x-model="config.pass" placeholder="CONTRASEÑA" class="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-sm border-2 border-transparent focus:border-blue-500 transition">
                <button @click="login()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase shadow-xl">Entrar</button>
            </div>
            <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[10px] mt-6 text-center font-black uppercase"></p>
        </div>
    </div>

    <div x-show="uploading" class="fixed inset-0 bg-slate-950/95 z-[200] flex flex-col items-center justify-center text-white">
        <div class="animate-spin h-14 w-14 border-4 border-emerald-500 border-t-transparent rounded-full mb-6"></div>
        <p class="font-black uppercase tracking-[0.2em] text-xs text-emerald-400" x-text="loaderMsg"></p>
    </div>

    <script>
        function vercelApp() {
            return {
                loggedIn: false, uploading: false, showFilters: false, zoomImg: null,
                activeProject: 'item15', masterData: [], filterHeaders: [],
                activeFilters: {}, searchMod: '', errorMsg: '', loaderMsg: '',
                config: { 
                    api: 'https://script.google.com/macros/s/AKfycbx-1fqx2ASC3WkXQc5257EezswucBf9kJXQbG4NEfrHmPjNPq6SCOwZVWrGtCjxIWqq4w/exec', 
                    token: 'JL_TIC_SECURE_2025_KEY', 
                    email: '', pass: '' 
                },

                async login() {
                    if(!this.config.email || !this.config.pass) return;
                    this.uploading = true; this.loaderMsg = "AUTENTICANDO...";
                    try {
                        const url = `${this.config.api}?action=get_data&token=${this.config.token}&email=${encodeURIComponent(this.config.email)}&password=${this.config.pass}&projectKey=${this.activeProject}`;
                        const res = await fetch(url);
                        const json = await res.json();
                        if (json.status === 'success') {
                            this.masterData = json.data;
                            this.filterHeaders = json.filterHeaders;
                            this.filterHeaders.forEach(f => this.activeFilters[f] = "");
                            this.loggedIn = true;
                        } else { this.errorMsg = json.message; }
                    } catch(e) { this.errorMsg = "ERROR DE CONEXIÓN"; }
                    finally { this.uploading = false; }
                },

                async submitFinalReport() {
                    if(!confirm(`¿Desea enviar los datos consolidados a la base final?`)) return;
                    this.uploading = true; this.loaderMsg = "GUARDANDO REPORTE FINAL...";
                    try {
                        const payload = {
                            action: 'submit_final',
                            token: this.config.token,
                            userEmail: this.config.email,
                            projectKey: this.activeProject,
                            payload: this.masterData 
                        };
                        const res = await fetch(this.config.api, { method: 'POST', body: JSON.stringify(payload) });
                        const json = await res.json();
                        if(json.status === 'success') alert(`✅ ${json.message}`);
                    } catch(e) { alert("ERROR AL GUARDAR"); }
                    finally { this.uploading = false; }
                },

                async uploadPhoto(ev, item, campo) {
                    const file = ev.target.files[0]; if(!file) return;
                    this.uploading = true; this.loaderMsg = "SUBIENDO IMAGEN...";
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = async () => {
                        const payload = {
                            action: 'upload_image',
                            token: this.config.token,
                            projectKey: this.activeProject,
                            codMod: item.COD_MOD,
                            nivel: item.Nivel,
                            campo: campo,
                            base64: reader.result
                        };
                        const res = await fetch(this.config.api, { method: 'POST', body: JSON.stringify(payload) });
                        const json = await res.json();
                        if(json.status === 'success') {
                            const imgObj = item.images.find(i => i.label === campo);
                            if(imgObj) imgObj.url = json.url;
                        } else { alert("ERROR: " + json.message); }
                        this.uploading = false;
                    };
                },

                getUniqueValues(f) { return [...new Set(this.masterData.map(d => d[f]))].filter(v => v).sort(); },
                get filteredData() { 
                    return this.masterData.filter(d => {
                        if(this.searchMod && !d.COD_MOD.toString().includes(this.searchMod)) return false;
                        for(let f of this.filterHeaders) { if(this.activeFilters[f] && d[f] !== this.activeFilters[f]) return false; }
                        return true;
                    });
                },
                switchProject(k) { this.activeProject = k; this.masterData = []; this.login(); },
                logout() { location.reload(); }
            }
        }
    </script>
</body>
</html>
