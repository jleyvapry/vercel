<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TMS | Envío Cambios Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .btn-send { box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.6); }
        .custom-file-input::-webkit-file-upload-button { visibility: hidden; }
        .custom-file-input::before { 
            content: '📷 Cambiar'; 
            display: inline-block; 
            background: #1e293b; 
            border-radius: 12px; 
            padding: 10px 16px; 
            color: white; 
            font-weight: 700; 
            font-size: 11px; 
            cursor: pointer; 
        }
    </style>
</head>
<body x-data="vercelApp()" class="bg-slate-100 font-['Inter']">

    <header x-show="loggedIn" x-cloak class="sticky top-0 z-50 bg-slate-900 text-white p-4 shadow-lg">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-black tracking-tighter italic uppercase">TMS <span class="text-blue-500">Monitor</span></h1>
            <div class="flex gap-2">
                <button @click="showFilters = !showFilters" class="px-4 py-2 bg-slate-800 rounded-xl text-xs font-bold uppercase tracking-widest">Filtros</button>
                <button @click="logout()" class="px-4 py-2 bg-red-900/40 text-red-300 rounded-xl text-xs font-bold">SALIR</button>
            </div>
        </div>
        <div class="flex p-1 bg-slate-800 rounded-2xl">
            <button @click="switchProject('item15')" class="flex-1 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest transition" :class="activeProject === 'item15' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'">Ancash</button>
            <button @click="switchProject('item3')" class="flex-1 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest transition" :class="activeProject === 'item3' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'">Piura</button>
        </div>
    </header>

    <div x-show="showFilters" x-transition class="bg-white p-6 shadow-2xl border-b space-y-5">
        <div class="grid grid-cols-2 gap-4">
            <template x-for="f in filterHeaders">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block" x-text="f"></label>
                    <select x-model="activeFilters[f]" class="w-full border-2 border-slate-100 rounded-xl p-3 text-xs bg-slate-50 focus:border-blue-500 outline-none transition">
                        <option value="">Todos</option>
                        <template x-for="v in getUniqueValues(f)"><option :value="v" x-text="v"></option></template>
                    </select>
                </div>
            </template>
        </div>
        <div class="relative">
            <span class="absolute left-4 top-3 text-slate-400 font-bold">🔍</span>
            <input type="text" x-model="searchMod" placeholder="BUSCAR CÓDIGO MODULAR..." class="w-full pl-10 p-4 border-2 border-slate-100 rounded-2xl text-xs font-bold bg-slate-50 focus:border-blue-500 outline-none">
        </div>
    </div>

    <main x-show="loggedIn" class="p-4 pb-40">
        <template x-for="item in filteredData" :key="item.id">
            <div class="bg-white rounded-[2rem] mb-6 shadow-sm overflow-hidden border border-slate-200 transition hover:shadow-md">
                <div class="p-5 bg-slate-50 border-b flex justify-between items-center">
                    <div>
                        <h3 class="font-black text-slate-800 text-sm leading-tight mb-1" x-text="item.IIEE"></h3>
                        <p class="text-[10px] font-bold text-slate-400 uppercase" x-text="item.COD_MOD + ' • ' + item.Nivel"></p>
                    </div>
                    <div class="bg-white p-2 rounded-xl border text-[9px] font-black text-slate-500" x-text="item.DISTRITO"></div>
                </div>
                
                <div class="p-5 space-y-4">
                    <template x-for="img in item.images">
                        <div class="flex items-center gap-4 bg-white p-3 rounded-2xl border-2 border-slate-50">
                            <div class="w-14 h-14 bg-slate-100 rounded-xl shrink-0 overflow-hidden border">
                                <img :src="img.url" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100?text=S/F'">
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[10px] font-black uppercase text-slate-500 mb-1" x-text="img.label"></p>
                                <p class="text-[9px] font-bold" :class="img.url ? 'text-green-500' : 'text-slate-300'" x-text="img.url ? '✓ CARGADO' : 'PENDIENTE'"></p>
                            </div>
                            <div class="shrink-0 relative">
                                <input type="file" accept="image/*" class="custom-file-input opacity-0 absolute inset-0 w-full h-full z-10 cursor-pointer" 
                                       @change="uploadPhoto($event, item, img.label)">
                                <div class="bg-slate-900 text-white px-4 py-2.5 rounded-xl text-[10px] font-black uppercase">Cambiar</div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <div x-show="loggedIn" class="fixed bottom-8 left-0 right-0 px-8 z-[60]">
        <button @click="submitFinalReport()" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-6 rounded-3xl btn-send flex items-center justify-center gap-4 transition-all active:scale-95 shadow-emerald-200">
            <span class="text-2xl">⚡</span>
            <div class="text-left">
                <p class="leading-none text-xl uppercase tracking-tighter">Enviar Reporte Final</p>
                <p class="text-[10px] opacity-90 font-bold uppercase tracking-widest mt-1" x-text="'Guardar en CambiosMonitor-' + (activeProject === 'item15' ? 'Ancash' : 'Piura')"></p>
            </div>
        </button>
    </div>

    <div x-show="!loggedIn" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-6 z-[100]">
        <div class="bg-white p-10 rounded-[3rem] w-full max-w-sm shadow-2xl">
            <div class="text-center mb-8">
                <p class="text-blue-600 font-black text-4xl italic">JL</p>
                <h2 class="text-xl font-black text-slate-900 uppercase tracking-widest mt-2">TMS Monitor</h2>
            </div>
            <div class="space-y-4">
                <input type="email" x-model="config.email" placeholder="CORREO" class="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-sm">
                <input type="password" x-model="config.pass" placeholder="CONTRASEÑA" class="w-full p-5 bg-slate-100 rounded-2xl outline-none font-bold text-sm">
                <button @click="login()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition">Entrar</button>
            </div>
            <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[10px] mt-6 text-center font-black uppercase border-t pt-4"></p>
        </div>
    </div>

    <div x-show="uploading" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[200] flex flex-col items-center justify-center text-white">
        <div class="relative w-20 h-20 mb-6">
            <div class="absolute inset-0 border-4 border-emerald-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="font-black uppercase tracking-[0.2em] text-xs text-emerald-400" x-text="loaderMsg"></p>
    </div>

    <script>
        function vercelApp() {
            return {
                loggedIn: false, uploading: false, showFilters: false,
                activeProject: 'item15', masterData: [], filterHeaders: [],
                activeFilters: {}, searchMod: '', errorMsg: '', loaderMsg: '',
                config: { 
                    api: 'https://script.google.com/macros/s/AKfycbwq95lYD-QFQNPkZRBzvwTqKFrjdiRiiN9BZ0e5Um8bomZu4QDHM-s5_rHlfysB7lJMoQ/exec', 
                    token: 'JL_TIC_SECURE_2025_KEY', 
                    email: '', pass: '' 
                },

                async login() {
                    if(!this.config.email || !this.config.pass) return;
                    this.uploading = true; this.loaderMsg = "AUTENTICANDO...";
                    try {
                        const url = `${this.config.api}?action=get_data&token=${this.config.token}&email=${encodeURIComponent(this.config.email)}&password=${this.config.pass}&projectKey=${this.activeProject}`;
                        const res = await fetch(url);
                        const json = await res.json();
                        if (json.status === 'success') {
                            this.masterData = json.data;
                            this.filterHeaders = json.filterHeaders;
                            this.filterHeaders.forEach(f => this.activeFilters[f] = "");
                            this.loggedIn = true;
                        } else { this.errorMsg = json.message; }
                    } catch(e) { this.errorMsg = "ERROR DE CONEXIÓN"; }
                    finally { this.uploading = false; }
                },

                async submitFinalReport() {
                    if(!confirm(`¿Desea enviar los datos de ${this.activeProject === 'item15' ? 'ANCASH' : 'PIURA'} a CambiosMonitor?`)) return;
                    this.uploading = true; this.loaderMsg = "GUARDANDO REPORTE FINAL...";
                    try {
                        const payload = {
                            action: 'submit_final',
                            token: this.config.token,
                            userEmail: this.config.email,
                            projectKey: this.activeProject,
                            payload: this.masterData 
                        };
                        const res = await fetch(this.config.api, { method: 'POST', body: JSON.stringify(payload) });
                        const json = await res.json();
                        if(json.status === 'success') alert(`✅ ${json.message}`);
                    } catch(e) { alert("ERROR AL GUARDAR"); }
                    finally { this.uploading = false; }
                },

                async uploadPhoto(ev, item, campo) {
                    const file = ev.target.files[0]; if(!file) return;
                    this.uploading = true; this.loaderMsg = "SUBIENDO IMAGEN...";
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = async () => {
                        const payload = {
                            action: 'upload_image',
                            token: this.config.token,
                            projectKey: this.activeProject,
                            codMod: item.COD_MOD,
                            nivel: item.Nivel,
                            campo: campo,
                            base64: reader.result
                        };
                        const res = await fetch(this.config.api, { method: 'POST', body: JSON.stringify(payload) });
                        const json = await res.json();
                        if(json.status === 'success') {
                            const imgObj = item.images.find(i => i.label === campo);
                            if(imgObj) imgObj.url = json.url;
                        } else { alert("ERROR: " + json.message); }
                        this.uploading = false;
                    };
                },

                getUniqueValues(f) { return [...new Set(this.masterData.map(d => d[f]))].filter(v => v).sort(); },
                get filteredData() { 
                    return this.masterData.filter(d => {
                        if(this.searchMod && !d.COD_MOD.toString().includes(this.searchMod)) return false;
                        for(let f of this.filterHeaders) { if(this.activeFilters[f] && d[f] !== this.activeFilters[f]) return false; }
                        return true;
                    });
                },
                switchProject(k) { 
                    this.activeProject = k; 
                    this.masterData = [];
                    this.login(); 
                },
                logout() { location.reload(); }
            }
        }
    </script>
</body>
</html>
